OCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repeat Timer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
      transition: background 0.3s ease;
    }

    h1 {
      margin-bottom: 20px;
    }

    .timer-box {
      max-width: 400px;
      margin: auto;
      background: #222;
      padding: 25px;
      border-radius: 15px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 20px;
      margin-top: 5px;
      text-align: center;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }

    #phase {
      font-size: 32px;
      margin-top: 30px;
      font-weight: bold;
    }

    #display {
      font-size: 80px;
      margin: 20px 0;
      font-weight: bold;
    }

    button {
      padding: 15px 25px;
      font-size: 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #startBtn {
      background: #28a745;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #resetBtn {
      background: #6c757d;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Repeat Timer</h1>

  <div class="timer-box">
    <label for="workTime">Countdown Time, seconds</label>
    <input type="number" id="workTime" value="10" min="1" />

    <label for="restTime">Rest Time, seconds</label>
    <input type="number" id="restTime" value="5" min="1" />

    <div id="phase">Ready</div>
    <div id="display">00</div>

    <button id="startBtn" onclick="startTimer()">Start</button>
    <button id="stopBtn" onclick="stopTimer()">Stop</button>
    <button id="resetBtn" onclick="resetTimer()">Reset</button>
  </div>

  <script>
    let timer = null;
    let currentTime = 0;
    let isRunning = false;
    let phase = "work";
    let audioContext = null;

    const display = document.getElementById("display");
    const phaseText = document.getElementById("phase");

    function startTimer() {
      if (isRunning) return;

      const workTime = parseInt(document.getElementById("workTime").value);
      const restTime = parseInt(document.getElementById("restTime").value);

      if (isNaN(workTime) || isNaN(restTime) || workTime <= 0 || restTime <= 0) {
        alert("Please enter valid countdown and rest times.");
        return;
      }

      // Create audio context after user presses Start.
      // Browsers require user interaction before sound can play.
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      isRunning = true;

      if (currentTime === 0) {
        phase = "work";
        currentTime = workTime;
        playAlert("work");
      }

      updateDisplay();

      timer = setInterval(() => {
        currentTime--;

        if (currentTime <= 0) {
          if (phase === "work") {
            phase = "rest";
            currentTime = restTime;
            playAlert("rest");
          } else {
            phase = "work";
            currentTime = workTime;
            playAlert("work");
          }
        }

        updateDisplay();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
      isRunning = false;
    }

    function resetTimer() {
      stopTimer();
      currentTime = 0;
      phase = "work";
      phaseText.textContent = "Ready";
      display.textContent = "00";
      document.body.style.background = "#111";
    }

    function updateDisplay() {
      display.textContent = currentTime.toString().padStart(2, "0");

      if (phase === "work") {
        phaseText.textContent = "Countdown";
        document.body.style.background = "#111";
      } else {
        phaseText.textContent = "Rest";
        document.body.style.background = "#1b3d1b";
      }
    }

    function playAlert(nextPhase) {
      playBeep(nextPhase);
      vibratePhone(nextPhase);
    }

    function playBeep(nextPhase) {
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      // Higher tone for countdown, lower tone for rest
      oscillator.frequency.value = nextPhase === "work" ? 900 : 500;
      oscillator.type = "sine";

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function vibratePhone(nextPhase) {
      if (!navigator.vibrate) return;

      if (nextPhase === "work") {
        // Stronger signal when countdown begins
        navigator.vibrate([200, 100, 200]);
      } else {
        // Shorter signal when rest begins
        navigator.vibrate(300);
      }
    }
  </script>

</body>
</html>
