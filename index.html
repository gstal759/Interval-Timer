<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interval Timer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
      transition: background 0.3s ease;
    }

    h1 {
      margin-bottom: 20px;
    }

    .timer-box {
      max-width: 420px;
      margin: auto;
      background: #222;
      padding: 25px;
      border-radius: 15px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 20px;
      margin-top: 5px;
      text-align: center;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }

    #repDisplay {
      font-size: 34px;
      margin-top: 25px;
      font-weight: bold;
      color: #ffc107;
    }

    #phase {
      font-size: 30px;
      margin-top: 10px;
      font-weight: bold;
    }

    #display {
      font-size: 80px;
      margin: 20px 0;
      font-weight: bold;
    }

    button {
      padding: 15px 25px;
      font-size: 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #startBtn {
      background: #28a745;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #resetBtn {
      background: #6c757d;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Interval Timer</h1>

  <div class="timer-box">

    <label for="readyTime">Ready Time, seconds</label>
    <input type="number" id="readyTime" value="5" min="0" />

    <label for="countdownTime">Countdown Timer, seconds</label>
    <input type="number" id="countdownTime" value="10" min="1" />

    <label for="restTime">Rest Timer, seconds</label>
    <input type="number" id="restTime" value="5" min="1" />

    <div id="repDisplay">Ready</div>
    <div id="phase">Ready</div>
    <div id="display">00</div>

    <button id="startBtn" onclick="startTimer()">Start</button>
    <button id="stopBtn" onclick="stopTimer()">Stop</button>
    <button id="resetBtn" onclick="resetTimer()">Reset</button>

  </div>

  <script>
    let timer = null;
    let currentTime = 0;
    let isRunning = false;
    let phase = "ready";
    let repCount = 1;
    let audioContext = null;
    let readyHasRun = false;

    const display = document.getElementById("display");
    const phaseText = document.getElementById("phase");
    const repDisplay = document.getElementById("repDisplay");

    function getReadyTime() {
      return parseInt(document.getElementById("readyTime").value);
    }

    function getCountdownTime() {
      return parseInt(document.getElementById("countdownTime").value);
    }

    function getRestTime() {
      return parseInt(document.getElementById("restTime").value);
    }

    function startTimer() {
      if (isRunning) return;

      const readyTime = getReadyTime();
      const countdownTime = getCountdownTime();
      const restTime = getRestTime();

      if (
        isNaN(readyTime) ||
        isNaN(countdownTime) ||
        isNaN(restTime) ||
        readyTime < 0 ||
        countdownTime <= 0 ||
        restTime <= 0
      ) {
        alert("Please enter valid ready, countdown, and rest times.");
        return;
      }

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      isRunning = true;

      if (currentTime === 0) {
        if (!readyHasRun && readyTime > 0) {
          phase = "ready";
          currentTime = readyTime;
          playAlert("ready");
        } else {
          phase = "countdown";
          currentTime = countdownTime;
          readyHasRun = true;
          playAlert("countdown");
        }
      }

      updateDisplay();

      timer = setInterval(function () {
        currentTime--;

        if (currentTime <= 0) {
          moveToNextPhase();
        }

        updateDisplay();
      }, 1000);
    }

    function moveToNextPhase() {
      const countdownTime = getCountdownTime();
      const restTime = getRestTime();

      if (phase === "ready") {
        readyHasRun = true;
        phase = "countdown";
        currentTime = countdownTime;
        playAlert("countdown");
      } 
      else if (phase === "countdown") {
        phase = "rest";
        currentTime = restTime;
        playAlert("rest");
      } 
      else if (phase === "rest") {
        repCount++;
        phase = "countdown";
        currentTime = countdownTime;
        playAlert("countdown");
      }
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
      isRunning = false;
    }

    function resetTimer() {
      stopTimer();

      currentTime = 0;
      phase = "ready";
      repCount = 1;
      readyHasRun = false;

      repDisplay.textContent = "Ready";
      phaseText.textContent = "Ready";
      display.textContent = "00";
      document.body.style.background = "#111";
    }

    function updateDisplay() {
      display.textContent = currentTime.toString().padStart(2, "0");

      if (phase === "ready") {
        repDisplay.textContent = "Get Ready";
        phaseText.textContent = "Ready";
        document.body.style.background = "#333";
      } 
      else if (phase === "countdown") {
        repDisplay.textContent = "Rep " + repCount;
        phaseText.textContent = "Countdown";
        document.body.style.background = "#111";
      } 
      else if (phase === "rest") {
        repDisplay.textContent = "Rep " + repCount;
        phaseText.textContent = "Rest";
        document.body.style.background = "#1b3d1b";
      }
    }

    function playAlert(nextPhase) {
      playBeep(nextPhase);
      vibratePhone(nextPhase);
    }

    function playBeep(nextPhase) {
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      if (nextPhase === "ready") {
        oscillator.frequency.value = 700;
      } else if (nextPhase === "countdown") {
        oscillator.frequency.value = 900;
      } else {
        oscillator.frequency.value = 500;
      }

      oscillator.type = "sine";

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.3
      );

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function vibratePhone(nextPhase) {
      if (!navigator.vibrate) return;

      if (nextPhase === "ready") {
        navigator.vibrate([150, 100, 150]);
      } else if (nextPhase === "countdown") {
        navigator.vibrate([200, 100, 200]);
      } else {
        navigator.vibrate(300);
      }
    }
  </script>

</body>
</html>
